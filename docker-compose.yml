services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    environment:
      - KEYCLOAK_ADMIN=${MY_KC_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${MY_KC_PASS}
    ports:
      - "8090:8080"
    command: start-dev
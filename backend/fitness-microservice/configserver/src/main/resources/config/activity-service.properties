# THE EUREKA ADDRESS
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
server.port=8082
# Force it to register with its IP instead of the buggy hostname
eureka.instance.prefer-ip-address=true
# Or, for absolute safety on a single machine:
eureka.instance.hostname=localhost

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=activities_db



# The connection port (must match the first -p 5672:5672)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# The virtual host you defined in your Docker command
# spring.rabbitmq.virtual-host=my_vhost

# Default credentials
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
